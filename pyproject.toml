[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v4sim"
version = "0.0.1"
description = "Backtesting/simulation harness for Uniswap v4 hooks against historical v3 swaps."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "karim" }]
license = { text = "MIT" }
dependencies = [
    # Data
    "polars>=1.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    # Viz (used in later steps; pinned here so envs are reproducible)
    "plotly>=5.20",
    # EVM (used from step 2 on)
    "pyrevm>=0.3.3,<0.4; python_version >= '3.11'",
    "eth-abi>=5.0",
    "eth-utils>=4.0",
    "eth-hash[pycryptodome]>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "ipykernel>=6.29",
]

[project.scripts]
v4sim-pull-swaps = "v4sim.data.subgraph:cli"
v4sim-replay = "v4sim.replay.runner:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["v4sim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
